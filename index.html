<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecdc">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var p = location.pathname;
      if (!p.endsWith("/") && !/\.[a-zA-Z0-9]+$/.test(p.split("/").pop() || "")) {
        location.replace(p + "/" + location.search + location.hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <title>Lam Wanders</title>
  <meta name="description" content="Lam's diary of wandering, eating and remembering.">
</head>
<body data-page="home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-edge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2"/>
    </filter>
    <filter id="ink-bleed" x="-2%" y="-40%" width="104%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.4" numOctaves="3" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
    </filter>
    <symbol id="seal-lt" viewBox="0 0 40 40">
      <rect x="1" y="1" width="38" height="38" rx="3" fill="#b0242a"/>
      <rect x="4.2" y="4.2" width="31.6" height="31.6" rx="1.2" fill="none" stroke="#fbf6ec" stroke-width="1.5"/>
      <g fill="none" stroke="#fbf6ec" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M10.5 9.5 V28.2 Q10.5 30 12.3 30 H18.4 V26.6"/>
        <path d="M20.8 13 V10 H31.4 V13"/>
        <path d="M26.1 10 V30.4"/>
      </g>
      <rect x="16" y="3.2" width="2.4" height="2.2" fill="#b0242a"/>
      <rect x="34.6" y="21" width="2.2" height="2.6" fill="#b0242a"/>
    </symbol>
  </defs>
</svg>
  <div class="page page-home">
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="seal" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#seal-lt"/></svg></span>
        <span class="brand-text">
          <span class="title">Lam Wanders</span>
          <span class="tagline">wandering, eating, remembering</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html" data-nav="home">Home</a>
        <a href="highlights.html" data-nav="highlights">Highlights</a>
        <a href="trips.html" data-nav="trips">Trips</a>
        <a href="about.html" data-nav="about">About</a>
      </nav>
    </header>

    <main>
      <section id="empty-state" class="empty-state">
        <div class="empty-card">
          <h1>The suitcase is still packed</h1>
          <p>No trips yet, first stop coming soon</p>
        </div>
      </section>
      <section id="home" hidden>
        <section class="timeline-intro">
          <span class="callig" lang="vi" aria-hidden="true">Đi</span>
          <h1>Every moment to cherish</h1>
          <p>Scroll to walk through the years. Pick a day to open all of its photos.</p>
        </section>
        <section class="timeline-scroller" id="timeline-scroller" aria-label="Timeline">
          <div class="timeline-sticky" id="timeline-sticky">
            <p class="check-in" id="check-in"></p>
            <div class="home-track" id="timeline-track">
              <div class="ink-layer" data-depth="0.15" aria-hidden="true">
                <span class="mist" style="left:8%;top:6%"></span>
                <span class="mist" style="left:46%;top:62%"></span>
                <span class="mist" style="left:78%;top:10%"></span>
              </div>
              <div class="brush-line" aria-hidden="true">
                <svg class="h" viewBox="0 0 1000 34" preserveAspectRatio="none" aria-hidden="true">
                  <path filter="url(#ink-bleed)" fill="currentColor" d="M0 18 C 40 12, 90 14, 160 15 S 300 20, 420 16 S 600 12, 720 17 S 900 21, 1000 15 L 1000 19 C 900 25, 820 22, 720 21 S 560 17, 420 21 S 260 25, 160 20 S 40 24, 0 21 Z"/>
                  <path fill="currentColor" opacity=".35" d="M0 16 C 200 14, 400 19, 600 15 S 860 13, 1000 17 L1000 17.6 C 860 15, 600 17, 400 20.4 S 200 16, 0 17.2 Z"/>
                </svg>
                <svg class="v" style="display:none" viewBox="0 0 28 2000" preserveAspectRatio="none" aria-hidden="true">
                  <defs>
                    <filter id="ink-soft-v" x="-40%" y="-1%" width="180%" height="102%">
                      <feGaussianBlur stdDeviation="0.4 0.12"/>
                    </filter>
                  </defs>
                  <path filter="url(#ink-soft-v)" fill="currentColor" d="M12.6 0 C 11.8 220, 15.4 440, 13.4 700 S 11.6 1180, 13.8 1540 S 15.2 1820, 13 2000 L 16.4 2000 C 18.2 1820, 16.8 1540, 16.6 1180 S 16.6 440, 16.2 0 Z"/>
                  <path fill="currentColor" opacity=".28" d="M13.4 0 C 12.8 260, 14.8 520, 13.8 860 S 12.8 1400, 14.2 2000 L 15.4 2000 C 14.2 1400, 15 860, 15 520 S 14.8 260, 15.2 0 Z"/>
                </svg>
              </div>
            </div>
            <span class="scroll-hint" aria-hidden="true">Scroll to wander</span>
          </div>
        </section>
        <nav class="year-jump" id="year-jump" aria-label="Jump to year" hidden></nav>
      </section>
    </main>
    <footer class="site-footer">
      <p>Kept with care by Spring Roll.</p>
    </footer>
  </div>
  <script src="js/common.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
