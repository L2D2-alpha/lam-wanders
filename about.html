<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecdc">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var p = location.pathname;
      if (!p.endsWith("/") && !/\.[a-zA-Z0-9]+$/.test(p.split("/").pop() || "")) {
        location.replace(p + "/" + location.search + location.hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <title>About — Lam Wanders</title>
  <meta name="description" content="About Lam Wanders, a travel diary kept by Spring Roll.">

</head>
<body data-page="about">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="deckle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-edge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2"/>
    </filter>
    <filter id="ink-bleed" x="-2%" y="-40%" width="104%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.4" numOctaves="3" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
    </filter>
    <symbol id="seal-lt" viewBox="0 0 40 40">
      <rect x="1" y="1" width="38" height="38" rx="3" fill="#b0242a"/>
      <rect x="4.2" y="4.2" width="31.6" height="31.6" rx="1.2" fill="none" stroke="#fbf6ec" stroke-width="1.5"/>
      <g fill="none" stroke="#fbf6ec" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M10.5 9.5 V28.2 Q10.5 30 12.3 30 H18.4 V26.6"/>
        <path d="M20.8 13 V10 H31.4 V13"/>
        <path d="M26.1 10 V30.4"/>
      </g>
      <rect x="16" y="3.2" width="2.4" height="2.2" fill="#b0242a"/>
      <rect x="34.6" y="21" width="2.2" height="2.6" fill="#b0242a"/>
    </symbol>
  </defs>
</svg>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="seal" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#seal-lt"/></svg></span>
        <span class="brand-text">
          <span class="title">Lam Wanders</span>
          <span class="tagline">a travel diary kept for the memories</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html" data-nav="home">Home</a>
        <a href="highlights.html" data-nav="highlights">Highlights</a>
        <a href="trips.html" data-nav="trips">Trips</a>
        <a href="about.html" data-nav="about">About</a>
      </nav>
    </header>

    <main>
      <article class="about-card">
        <header class="page-hero">
          <p class="eyebrow">About Me</p>
          <h1 id="about-title">About Me</h1>
        </header>
        <p class="about-intro" id="about-intro">Lam's travel diary, kept with help from Spring Roll.</p>
        <div class="about-body is-placeholder" id="about-body" hidden>
          <p>A few lines about Lam can go here when he's ready to write them.</p>
        </div>
        <section class="photos about-photos" id="about-photos" hidden aria-label="Photos of Mochi"></section>
        <p class="about-caption" id="about-caption" hidden></p>
      </article>

    </main>
    <dialog class="lightbox" aria-label="Photo viewer">
      <div class="lightbox-inner">
        <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">&#8592;</button>
        <img alt="">
        <button class="lb-btn lb-next" type="button" aria-label="Next photo">&#8594;</button>
        <p class="lb-cap"></p>
        <button class="lb-btn lb-close" type="button" aria-label="Close">&#215;</button>
      </div>
    </dialog>
    <footer class="site-footer">
      <p>Kept with care by Spring Roll.</p>
    </footer>

  </div>
  <script src="js/common.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/about.js"></script>
</body>
</html>
